<!doctype html>
<html lang="en" data-mode="light" data-accent="gold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="Calvary Chapel Iloilo — a Bible-believing church in Iloilo City. Evangelism: showing the way. Discipleship: teaching the truth. Mission: living the life."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <title>Calvary Chapel Iloilo</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cc_theme_mode') || 'system';
          var accent = localStorage.getItem('cc_theme_accent') || 'gold';
          var dark =
            pref === 'dark' ||
            pref === 'midnight' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mode = pref === 'midnight' ? 'midnight' : pref === 'sepia' ? 'sepia' : dark ? 'dark' : 'light';
          document.documentElement.dataset.mode = mode;
          document.documentElement.dataset.pref = pref;
          document.documentElement.dataset.accent = accent;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
